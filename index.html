<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parametric Heart Curve Interactive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background-color: #000000;
      border-radius: 24px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.2;
      color: #ffffff;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background-color: #1c1c1e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2c2c2e;
    }

    .btn-blue {
      background-color: #2b3a67;
      color: #8da4f7;
    }

    .btn-blue:hover {
      background-color: #3b4c80;
    }

    
    .canvas-container {
      position: relative;
      width: 100%;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    
    .tooltip {
      position: absolute;
      background-color: #2b3a67;
      color: #8da4f7;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
      transform: translate(-50%, -100%);
      margin-top: -10px;
      display: none;
    }

    .tooltip::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 4px 4px 0;
      border-style: solid;
      border-color: #2b3a67 transparent;
    }

    
    .readouts {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
    }

    .readout-item {
      text-align: center;
    }

    .readout-label {
      font-size: 12px;
      color: #8e8e93;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .readout-value {
      font-size: 18px;
      font-weight: 600;
    }

    .divider {
      width: 1px;
      height: 24px;
      background-color: #2c2c2e;
    }

    /* Slider Container */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .slider-label {
      font-size: 14px;
      color: #ebebf5;
      white-space: nowrap;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #2c2c2e;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .slider-value-box {
      background-color: #1c1c1e;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-family: monospace;
      min-width: 75px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <div class="header">
      <div class="title">Parametric Heart<br>Curve</div>
      <div class="controls">
        <button class="btn btn-blue" id="playPauseBtn">
          <!-- Pause Icon -->
          <svg id="pauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="5" y="3" width="4" height="18" rx="1" />
            <rect x="15" y="3" width="4" height="18" rx="1" />
          </svg>
          
          <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
        <button class="btn" id="resetBtn">
          
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>
    </div>

    
    <div class="canvas-container">
      <canvas id="heartCanvas"></canvas>
      <div class="tooltip" id="tooltip">t: 0.00</div>
    </div>

    
    <div class="readouts">
      <div class="readout-item">
        <div class="readout-label">X(T)</div>
        <div class="readout-value" id="xVal">0.00</div>
      </div>
      <div class="divider"></div>
      <div class="readout-item">
        <div class="readout-label">Y(T)</div>
        <div class="readout-value" id="yVal">12.00</div>
      </div>
    </div>

    
    <div class="slider-container">
      <span class="slider-label">Trace Position</span>
      <input type="range" id="traceSlider" min="0" max="6.28318" step="0.001" value="0">
      <div class="slider-value-box" id="sliderVal">0.00000</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const playIcon = document.getElementById('playIcon');
    const traceSlider = document.getElementById('traceSlider');
    const sliderValDisplay = document.getElementById('sliderVal');
    const xValDisplay = document.getElementById('xVal');
    const yValDisplay = document.getElementById('yVal');
    const tooltip = document.getElementById('tooltip');

    let isPlaying = true;
    let currentT = 0;
    const maxT = Math.PI * 2; 
    const speed = 0.015;

    
    function setupCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }

    
    function calculateHeartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x, y };
    }

    function render() {
      const width = canvas.getBoundingClientRect().width;
      const height = canvas.getBoundingClientRect().height;
      const centerX = width / 2;
      const centerY = height / 2 + 10;
      const scale = width / 38; 
      ctx.clearRect(0, 0, width, height);

      
      ctx.beginPath();
      ctx.strokeStyle = '#2c2c2e';
      ctx.lineWidth = 1;
      // Y-axis
      ctx.moveTo(centerX, 0);
      ctx.lineTo(centerX, height);
      // X-axis
      ctx.moveTo(0, centerY);
      ctx.lineTo(width, centerY);
      ctx.stroke();

      
      ctx.beginPath();
      const steps = 300;
      for (let i = 0; i <= steps; i++) {
        const stepT = (i / steps) * maxT;
        const pt = calculateHeartPoint(stepT);
        const px = centerX + pt.x * scale;
        const py = centerY - pt.y * scale;

        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = '#8da4f7';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      
      const currentPt = calculateHeartPoint(currentT);
      const activeX = centerX + currentPt.x * scale;
      const activeY = centerY - currentPt.y * scale;

      ctx.beginPath();
      ctx.arc(activeX, activeY, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

    
      tooltip.style.display = 'block';
      tooltip.style.left = `${activeX}px`;
      tooltip.style.top = `${activeY}px`;
      tooltip.textContent = `t: ${currentT.toFixed(2)}`;

     
      xValDisplay.textContent = currentPt.x.toFixed(2);
      yValDisplay.textContent = currentPt.y.toFixed(2);
      sliderValDisplay.textContent = currentT.toFixed(5);
      traceSlider.value = currentT;
    }

    function animationLoop() {
      if (isPlaying) {
        currentT += speed;
        if (currentT > maxT) {
          currentT = 0;
        }
        render();
      }
      requestAnimationFrame(animationLoop);
    }

   
    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      pauseIcon.style.display = isPlaying ? 'block' : 'none';
      playIcon.style.display = isPlaying ? 'none' : 'block';
    });

    resetBtn.addEventListener('click', () => {
      currentT = 0;
      render();
    });

    traceSlider.addEventListener('input', (e) => {
      currentT = parseFloat(e.target.value);
      render();
    });

    
    window.addEventListener('resize', () => {
      setupCanvas();
      render();
    });

    setupCanvas();
    render();
    animationLoop();
  </script>
</body>
</html>
